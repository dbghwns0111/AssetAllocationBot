<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAA 리밸런싱</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>HAA 리밸런싱</h1>
    <p class="sub">Hybrid Asset Allocation · Keller &amp; Keuning</p>
  </div>
  <div class="top-actions">
    <label class="chk" title="진행 중인 이번 달 최신 종가로 미리 계산합니다 (참고용)">
      <input type="checkbox" id="partial"> 당월 최신가로 미리보기
    </label>
    <button id="refresh" class="btn">데이터 새로고침</button>
  </div>
</header>

<main>
  <div id="error" class="error hidden"></div>

  <section class="grid2">
    <div class="card" id="signal-card">
      <h2>이번 달 신호</h2>
      <div id="signal" class="loading">불러오는 중…</div>
    </div>
    <div class="card">
      <h2>목표 비중</h2>
      <div id="weights"></div>
    </div>
  </section>

  <section class="card">
    <h2>13612U 모멘텀</h2>
    <p class="hint">(1개월 + 3개월 + 6개월 + 12개월 수익률) ÷ 4 · 월말 수정종가 기준</p>
    <div class="scroll"><table id="momentum" class="tbl"></table></div>
  </section>

  <section class="card">
    <h2>리밸런싱 계산기</h2>
    <p class="hint">현재 보유 수량과 현금을 입력하면 목표 수량과 매매 수량을 계산합니다. 직전 기록이 있으면 자동으로 채워집니다. 체결 후 실제 수량·체결가를 고쳐서 기록하세요.</p>
    <div class="calc-opts">
      <label>리밸런싱 날짜 <input type="date" id="rb-date"></label>
      <label>보유 현금 (USD) <input type="number" id="cash" step="0.01" value="0"></label>
      <label>추가 입금/출금 (USD) <input type="number" id="deposit" step="0.01" value="0"></label>
      <label class="chk"><input type="checkbox" id="fractional"> 소수점 매매</label>
    </div>
    <div class="scroll"><table id="calc" class="tbl"></table></div>
    <div class="calc-summary" id="calc-summary"></div>
    <div class="save-row">
      <input type="text" id="memo" placeholder="메모 (예: 환율 1,390원, 수수료 등)">
      <button id="save" class="btn primary">이번 리밸런싱 기록 저장</button>
    </div>
  </section>

  <section class="card">
    <h2>리밸런싱 기록</h2>
    <div class="scroll"><table id="records" class="tbl"></table></div>
  </section>

  <section class="card">
    <h2>최근 신호 이력</h2>
    <p class="hint">각 월말 신호와 그 다음 달 전략 수익률 (수수료·세금 제외 단순 계산)</p>
    <div class="scroll"><table id="history" class="tbl"></table></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
